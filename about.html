<!-- ==================== 评论系统（模板参考） ==================== -->
<!--
  以下评论系统默认不启用。
  启用条件：在 _config.yml 中取消对应配置的注释并设置 enable: true。

  当前状态：
    - Gitalk  : _config.yml 中 gitalk 整块被注释 → 不启用
    - Disqus  : _config.yml 中 disqus_username 被注释 → 不启用
-->


<!-- ============================================================
  Gitalk 评论（基于 GitHub Issues）
  ============================================================
  启用步骤：
    1. 在 _config.yml 中取消 gitalk 配置块的注释
    2. 将 gitalk.enable 设为 true
    3. 填入你的 clientID、clientSecret、repo、owner、admin
       （需先在 GitHub 创建 OAuth Application）

  参数说明：
    clientID             : GitHub OAuth App 的 Client ID
    clientSecret         : GitHub OAuth App 的 Client Secret
    repo                 : 存放评论的仓库名（如 "username.github.io"）
    owner                : GitHub 用户名
    admin                : 仓库管理员用户名（可初始化评论）
    distractionFreeMode  : 是否启用类似 Facebook 的阴影遮罩
    id                   : 页面唯一标识（同一页面评论共享，可自定义）
  ============================================================ -->
{% if site.gitalk.enable %}
<link rel="stylesheet" href="https://unpkg.com/gitalk/dist/gitalk.css">
<script src="https://unpkg.com/gitalk@latest/dist/gitalk.min.js"></script>

<div id="gitalk-container"></div>
<script type="text/javascript">
  var gitalk = new Gitalk({
    clientID: '{{site.gitalk.clientID}}',
    clientSecret: '{{site.gitalk.clientSecret}}',
    repo: '{{site.gitalk.repo}}',
    owner: '{{site.gitalk.owner}}',
    admin: ['{{site.gitalk.admin}}'],
    distractionFreeMode: {{site.gitalk.distractionFreeMode}},
    id: 'about',
  });
  gitalk.render('gitalk-container');
</script>
{% endif %}


<!-- ============================================================
  Disqus 评论
  ============================================================
  启用步骤：
    1. 在 _config.yml 中添加 disqus 配置块：
         disqus:
           enable: true
           username: your_disqus_shortname
    2. 在 https://disqus.com/ 注册站点获取 shortname

  注：原 _config.yml 只有一个被注释的 disqus_username，
      缺少 enable 子键，需按上述格式补充才能启用。
  ============================================================ -->
{% if site.disqus.enable %}

<div class="comment">
  <div id="disqus_thread" class="disqus-thread"></div>
</div>

<script type="text/javascript">
  /* Disqus 配置变量 */
  var disqus_shortname = "{{site.disqus.username}}";          // Disqus 站点 shortname
  var disqus_identifier = "{{site.disqus.username}}/{{page.url}}";  // 页面唯一标识
  var disqus_url = "{{site.url}}{{page.url}}";                // 页面完整 URL

  /* 异步加载 Disqus 嵌入脚本 */
  (function() {
    var dsq = document.createElement('script');
    dsq.type = 'text/javascript';
    dsq.async = true;
    dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
    (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
  })();
</script>
{% endif %}
