<!-- 
  ============================================================
  about.html — 关于页面
  ============================================================
  
  layout: page → 继承 page.html 布局 (default → page)
  
  front-matter 变量:
    title       : "About" — 页面标题 (浏览器标签页 + 头部大标题)

    header-img  : 头部背景图片

---
layout: page
title: "About"
description: "一个没什么干货的博客"
header-img: "img/64800561_p0.jpg"
---

<!--

<p>自用博客,主要用于记录一些动漫观看随笔和网上有意思的发言,还可能写点读书笔记.</p>

<p>本博客还有很多东西没有做好,将来可能会(也可能不会)逐步完善.</p>


<!-- 
  ===== Gitalk 评论 =====
  
  配置: _config.yml 的 site.gitalk 对象
  
  id: 'about' — 使用固定字符串 'about' 作为 Issue 标识,
  而非 window.location.pathname (文章页的做法)。
  这样所有关于页的评论都集中在一个 Issue 中。
  
  ⚠ 与 keynote.html 的差异:
    - 此处包含 distractionFreeMode 参数 (keynote.html 未包含)
    - 此处 id 为固定字符串, keynote.html 用 window.location.pathname
-->
{% if site.gitalk.enable %}
<link rel="stylesheet" href="https://unpkg.com/gitalk/dist/gitalk.css">
<script src="https://unpkg.com/gitalk@latest/dist/gitalk.min.js"></script>
<div id="gitalk-container"></div>
<script type="text/javascript">
    var gitalk = new Gitalk({
    clientID: '{{site.gitalk.clientID}}',
    clientSecret: '{{site.gitalk.clientSecret}}',
    repo: '{{site.gitalk.repo}}',
    owner: '{{site.gitalk.owner}}',
    admin: ['{{site.gitalk.admin}}'],
    distractionFreeMode: {{site.gitalk.distractionFreeMode}},
    id: 'about',
    });
    gitalk.render('gitalk-container');
</script>
{% endif %}


<!-- 
  ===== Disqus 评论 (旧方案) =====
  
  配置: site.disqus.enable = true 时启用
  
  ⚠ 关于页的 Disqus 配置与文章页不同:
    disqus_identifier = "用户名/页面URL" (文章页只用 page.id)
    disqus_url        = site.url + page.url (文章页相同)
-->
{% if site.disqus.enable %}
<div class="comment">
    <div id="disqus_thread" class="disqus-thread"></div>
</div>
<script type="text/javascript">
    /* * * CONFIGURATION VARIABLES * * */
    var disqus_shortname = "{{site.disqus.username}}";
    var disqus_identifier = "{{site.disqus.username}}/{{page.url}}";
    var disqus_url = "{{site.url}}{{page.url}}";

    (function() {
        var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
        dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
        (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
    })();
</script>
{% endif %}
