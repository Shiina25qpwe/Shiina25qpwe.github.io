# ============================================================
#  codecov.yml — Codecov 代码覆盖率服务配置
#  ============================================================
#  文档：https://docs.codecov.com/docs/codecov-yaml
#
#  ⚠️ 适用场景警告：
#     本博客是 Jekyll 静态站点，没有任何测试代码，
#     因此 Codecov 覆盖率上报在此项目中无实际作用。
#     此文件连同 .travis.yml 中的 Codecov 上传命令
#     可安全删除（已在 .travis.yml 中移除上传步骤）。
#
#  🔒 安全提醒：
#     token 是上传覆盖率报告的凭证，不应提交到公开仓库。
#     由于此 token 已暴露在 Git 历史记录中，建议：
#       1. 登录 https://codecov.io 吊销此 token
#       2. 如需在未来项目中使用，重新生成并通过 CI 环境变量注入
#       3. 使用 CODECOV_TOKEN 环境变量替代此文件中的明文 token
#  ============================================================

codecov:
  # token : Codecov 上传令牌（用于关联覆盖率报告到对应仓库）
  #         更安全的替代方式：在 CI 中设置 CODECOV_TOKEN 环境变量
  token: d8b2c89f-64a9-4b9a-ac44-da4e871caeff
