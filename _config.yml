# ============================================================
#  _config.yml — Jekyll 站点全局配置文件
# ============================================================
#  本文件控制整个博客的所有行为：
#    站点元信息 → 侧边栏 → 社交链接 → 构建参数 → 评论 → 统计 → PWA → 友链
#  所有以 # 开头的行是注释（不会被 Jekyll 读取）
# ============================================================


# ============================================================
# 1. 站点基本设置（Site Settings）
# ============================================================

# title          : 博客标题（显示在首页顶部大图和浏览器标签页）
# SEOTitle       : SEO 标题（搜索引擎结果和浏览器标签页中显示的标题）
# header-img     : 首页顶部大图的背景图片路径（相对于站点根目录）
# email          : 邮箱地址（可选，默认注释）
# description    : 站点描述（显示在 <meta name="description"> 中，搜索引擎摘要用）
# keyword        : 站点关键词（逗号分隔，显示在 <meta name="keywords"> 中）
# url            : 站点完整 URL（用于绝对链接和 sitemap 生成，末尾不加 "/"）
# baseurl        : 子路径（如博客部署在 https://example.com/blog，则填 "/blog"）
# github_repo    : GitHub 仓库地址（用于页脚链接，可选）
title: BYQ0002
SEOTitle: BYQ0002
header-img: img/64724388_p0.png
#email: qiubaiying@gmail.com
description: "主要写ACG相关随笔的备用博客"
keyword: "anime, comic, game"
url: "https://byq0002.github.io/"
baseurl: ""
github_username: BYQ0002                # GitHub 用户名（用于页脚 Star 按钮）
github_repo: "https://github.com/BYQ0002/BYQ0002.github.io"  # GitHub 仓库地址


# ============================================================
# 2. 侧边栏设置（Sidebar Settings）
# ============================================================

# sidebar                       : 是否启用侧边栏（true=显示，false=隐藏）
# sidebar-about-description     : 侧边栏个人简介文字
# sidebar-avatar                : 侧边栏头像图片路径（建议使用绝对路径，因为首页和关于页都会用到）
sidebar: true
sidebar-about-description: "这个人很懒,他什么都没写"
sidebar-avatar: /img/18614610_p0.png


# ============================================================
# 3. 社交网络链接（SNS / Social Network Settings）
# ============================================================
#  取消注释即可启用对应的社交图标（图标显示在页脚和侧边栏）
#  图标由 Font Awesome 4 提供（需确认图标名称在 FA4 中存在）
#
#  可用平台及变量名：
#    RSS              : RSS 订阅（站内 /feed.xml）
#    weibo_username   : 微博用户名
#    zhihu_username   : 知乎用户名
#    github_username  : GitHub 用户名
#    facebook_username: Facebook 用户名
#    jianshu_username : 简书用户 ID（URL 中的那串字符）
#    twitter_username : Twitter 用户名
#    linkedin_username: LinkedIn 用户名

RSS: false
# weibo_username:     qiubaiying
# zhihu_username:     qiubaiying
# github_username:    qiubaiying
# facebook_username:  baiying.qiu.7
# jianshu_username:   e71990ada2fd
# twitter_username:   qiubaiying
# linkedin_username:  qiubaiying


# ============================================================
# 4. Jekyll 构建设置（Build Settings）
# ============================================================

# theme         : Jekyll 主题（GitHub Pages 使用）
#                 jekyll-theme-slate 是 GitHub Pages 默认主题之一
#                 由于本站使用自定义布局和 CSS，主题仅提供基础 fallback
theme: jekyll-theme-slate

# permalink      : 文章永久链接格式
#                  "pretty" → /:categories/:year/:month/:day/:title/
#                  其他内置值：date, ordinal, none
#                  https://jekyllrb.com/docs/permalinks/
permalink: pretty

# paginate       : 首页每页显示的文章数量
#                  首页文件必须是 index.html（含 paginator 逻辑）
paginate: 10

# plugins        : Jekyll 插件列表（GitHub Pages 仅支持白名单内的插件）
#                  jekyll-paginate 是分页必须的官方插件
#                  注意：Jekyll 3.x 起推荐使用 plugins 代替旧的 gems 键名
plugins: [jekyll-paginate]

# exclude        : 构建时排除的文件和目录（不复制到 _site 输出目录）
#                  这些是开发工具文件，不需要部署到生产环境
exclude:
  - "less"
  - "node_modules"
  - "Gruntfile.js"
  - "package.json"
  - "README.md"

# anchorjs       : 是否启用标题锚点链接（鼠标悬停标题时显示 "#" 链接图标）
#                  具体实现见 post.html 约第 181 行
anchorjs: true


# ============================================================
# 5. Markdown 渲染设置
# ============================================================

# markdown       : Markdown 解析引擎
#                 kramdown 支持 GFM（GitHub Flavored Markdown）、自动生成标题 id（用于目录导航）
#                 曾用 redcarpet（代码高亮好但缺 header-id），现用 kramdown
markdown: kramdown

# highlighter    : 代码高亮引擎
#                 rouge 是 GitHub Pages 官方推荐（Jekyll 3.x 起 Pygments 不再支持）
highlighter: rouge

# kramdown 详细配置
#   input: GFM  使用 GitHub Flavored Markdown 语法扩展
#               （支持围栏代码块、表格、删除线、任务列表等）
kramdown:
  input: GFM


# ============================================================
# 6. 评论系统（Comment System）
# ============================================================
#  以下评论系统三选一，取消对应注释即可启用

# ---- Disqus（https://disqus.com/） ----
# disqus_username: qiubaiying

# ---- Gitalk（基于 GitHub Issues，https://github.com/gitalk/gitalk） ----
# 需要先在 GitHub 创建 OAuth Application 获取 clientID 和 clientSecret
# gitalk:
#   enable: true                          # 是否启用 Gitalk 评论
#   clientID: f2c84e7629bb1446c1a4        # GitHub OAuth App 的 Client ID
#   clientSecret: ca6d6139d1e1b8c43f8b2e19492ddcac8b322d0d  # Client Secret（不要公开）
#   repo: qiubaiying.github.io            # 存放评论的 GitHub 仓库名
#   owner: qiubaiying                     # GitHub 用户名
#   admin: qiubaiying                     # 仓库管理员（可初始化评论）
#   distractionFreeMode: true             # 是否启用类似 Facebook 的阴影遮罩


# ============================================================
# 7. 网站统计（Analytics Settings）
# ============================================================

# ---- 百度统计（Baidu Analytics） ----
# 注册地址：https://tongji.baidu.com/
# ba_track_id: b50bf2b12b5338a1845e33832976fd68

# ---- Google Analytics ----
# 注册地址：https://analytics.google.com/
# ga_track_id : 跟踪 ID，格式 UA-XXXXXXXXX-X（旧版）或 G-XXXXXXXXXX（GA4）
# ga_domain   : 域名设置，"auto" 表示自动检测，也可指定自定义域名
# ga_track_id: 'UA-90855596-1'
# ga_domain: auto


# ============================================================
# 8. 首页特色标签（Featured Tags）
# ============================================================

# featured-tags            : 是否在首页显示热门标签
# featured-condition-size  : 标签出现次数 ≥ 此值才会被标记为"特色"并在首页展示
featured-tags: true
featured-condition-size: 1


# ============================================================
# 9. PWA 渐进式 Web 应用（Progressive Web Apps）
# ============================================================

# chrome-tab-theme-color : Chrome/Android 浏览器标签栏/状态栏主题色
#                          使用十六进制格式，需加引号（否则 # 会被 YAML 视为注释）
#                          该值注入到 head.html 的 <meta name="theme-color"> 中
chrome-tab-theme-color: "#000000"

# service-worker         : 是否启用 Service Worker（PWA 离线缓存）
#                          true  → footer.html 中注册 sw.js
#                          false → 不注册（减少一个 JS 请求）
#                          前提：站点必须使用 HTTPS（localhost 除外）
service-worker: true


# ============================================================
# 10. 友链（Friends / Blogroll）
# ============================================================
#  取消注释并在数组中添加对象即可在侧边栏显示友情链接
#
#  每条友链的格式：
#    title : 链接文字（友链名称）
#    href  : 链接地址（完整 URL）
#
# friends:
#   - title: "WY"
#     href: "http://zhengwuyang.com"
#   - title: "简书·BY"
#     href: "http://www.jianshu.com/u/e71990ada2fd"
#   - title: "Apple"
#     href: "https://apple.com"
#   - title: "Apple Developer"
#     href: "https://developer.apple.com/"
