<!-- 
  ============================================================
  nav.html - 站点顶部导航栏
  ============================================================
  此文件通过 layout 的 {% include nav.html %} 引入每个页面顶部。
  包含两大部分：
    1. Bootstrap 导航栏 HTML 结构（含 Liquid 动态生成页面链接）
    2. 自定义 JS 实现 Material Design 风格折叠动画（替代 Bootstrap 原生低性能方案）
-->

<!-- 
  ===== Bootstrap v3 固定顶部导航栏 =====
  
  CSS 类说明：
    navbar            : 基础导航栏容器
    navbar-default    : 默认浅色主题（白色背景 + 灰色边框）
    navbar-custom     : 主题自定义样式钩子（hux-blog.css 中覆盖默认样式）
    navbar-fixed-top  : 固定于视口顶部（position: fixed; top: 0）
                        ⚠ 会脱离文档流，需在 body 上加 padding-top 防止内容被遮挡
    container-fluid   : 100% 宽度容器（非固定宽度 .container），自适应屏幕
-->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">

        <!-- 
          ===== 导航栏头部（移动端 Logo + 汉堡按钮） =====
          
          navbar-header : Bootstrap 导航栏头部区域
          page-scroll   : 自定义类（可能用于平滑滚动，此处为语义标记）
        -->
        <div class="navbar-header page-scroll">
            
            <!-- 
              汉堡菜单按钮（仅小屏可见）
              
              navbar-toggle  : Bootstrap 类，小屏显示（≥768px 隐藏）
              type="button"  : 防止在表单内触发 submit
              
              内部三个 <span class="icon-bar"> 各渲染为一条横线：
              ████  → 第一条线
              ████  → 第二条线  
              ████  → 第三条线
              CSS 将它们堆叠成经典"三明治"图标
              
              sr-only : "Screen Reader Only" — 视觉隐藏但屏幕阅读器可读
                        为视障用户提供按钮文字说明
            -->
            <button type="button" class="navbar-toggle">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <!-- 
              站点 Logo/标题（链接到首页）
              
              navbar-brand : Bootstrap 类，品牌标识专用样式（字体略大、颜色突出）
              site.baseurl : _config.yml 中的站点根路径，部署在子目录时需设置
              site.title   : _config.yml 中的站点标题
            -->
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        </div>

        <!-- 
          ===== 导航菜单（可折叠区域） =====
          
          结构层级（由外到内）:
            #huxblog_navbar         → 自定义 JS 操控的容器（折叠动画主体）
              .navbar-collapse      → Bootstrap 折叠内容区（响应式显示/隐藏）
                ul.nav.navbar-nav   → 导航链接列表
          
          注意：这里没有使用 Bootstrap 原生的 .collapse + data-toggle 属性，
          而是用自定义 JS 实现折叠动画（见下方 <script>），原因：
            - Bootstrap 原生折叠依赖 jQuery + 笨重的 height 过渡
            - 自定义方案使用 CSS3 transform/opacity，性能更好（GPU 加速）
        -->
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                
                <!-- 
                  nav            : 基础导航列表样式
                  navbar-nav     : 导航栏专用链接列表
                  navbar-right   : 菜单右对齐（配合品牌标识左对齐形成两端布局）
                -->
                <ul class="nav navbar-nav navbar-right">
                    
                    <!-- 
                      Home 链接（硬编码，始终显示）
                      指向站点根路径
                    -->
                    <li>
                        <a href="{{ site.baseurl }}/">Home</a>
                    </li>
                    
                    <!-- 
                      ===== Liquid 动态生成页面链接 =====
                      
                      {% for page in site.pages %}
                        遍历 _config.yml 同目录下的所有页面（不包括 _posts 文章）
                        site.pages 是 Jekyll 内置全局变量，包含所有页面的数组
                      
                      {% if page.title %}
                        过滤器：仅渲染 front-matter 中声明了 title 的页面
                        防止 _layouts、_includes 等无标题页面出现在导航栏
                      
                      {{ page.url | prepend: site.baseurl }}
                        页面 URL（如 /about/）拼接 baseurl 得到完整路径
                      
                      示例渲染结果（假设有 about.md 和 tags.md）：
                        <li><a href="/about/">About</a></li>
                        <li><a href="/tags/">Tags</a></li>
                      
                      ⚠ 注意：页面在导航栏中的顺序 = 文件名字母顺序，
                      如需自定义顺序，可在 front-matter 中设置 weight 然后用 sort 过滤
                    -->
                    {% for page in site.pages %}{% if page.title %}
                    <li>
                        <a href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
                    </li>
                    {% endif %}{% endfor %}
                </ul>
            </div>
        </div>
    </div>
</nav>


<!-- 
  ============================================================
  自定义导航栏 JS（替代 Bootstrap 原生折叠）
  ============================================================
  
  设计理念：
    Bootstrap 原生导航栏使用 jQuery + CSS height 过渡实现折叠动画，
    在移动端性能差（频繁重排/重绘导致"jank"=卡顿）。
    此自定义方案使用 class 切换触发 CSS3 transition，
    由 GPU 处理动画，流畅度更高。

  全局变量（$ 前缀仅为标识 DOM 元素，非 jQuery）：
    $toggle   : 汉堡菜单按钮
    $navbar   : 自定义折叠容器 (#huxblog_navbar)
    $collapse : Bootstrap 折叠内容区 (.navbar-collapse)，用于 height 控制
  
  __HuxNav__ 对象：封装折叠/展开逻辑
    close() : 关闭菜单（400ms 延迟后折叠 height 为 0）
    open()  : 打开菜单（先设置 height: auto 展开，再添加动画类）
-->

<script>
    // ===== DOM 元素引用 =====
    var $toggle   = document.querySelector('.navbar-toggle');  // 汉堡按钮
    var $navbar   = document.querySelector('#huxblog_navbar'); // 自定义动画容器
    var $collapse = document.querySelector('.navbar-collapse'); // 折叠内容区

    // ===== 导航栏控制对象 =====
    var __HuxNav__ = {
        /**
         * close() - 关闭导航菜单
         * 
         * 步骤：
         *   1. 移除 'in' 类 → 触发 CSS transition 反向动画（菜单淡出/滑出）
         *   2. 等待 400ms（与 CSS transition 持续时间匹配）
         *   3. 确认菜单仍处于关闭状态后，将 height 设为 0
         *      height: 0 防止隐藏的菜单仍可被屏幕阅读器/焦点访问
         * 
         * setTimeout 延迟 400ms 的原因：
         *   必须等 CSS 动画完成后再折叠 height，否则动画会被截断
         * 
         * 二次检查 contains('in') 的原因：
         *   防止用户在动画期间快速点击导致状态错乱
         *   （如果动画期间又被 open()，contains('in') 为 true，跳过 height 折叠）
         */
        close: function(){
            $navbar.classList.remove('in');
            // 等待 CSS 动画结束（与 CSS 中 transition-duration 保持一致）
            setTimeout(function(){
                // 二次确认：动画期间未被再次打开
                if(!$navbar.classList.contains('in')) {
                    $collapse.style.height = "0px";
                }
            }, 400);
        },

        /**
         * open() - 打开导航菜单
         * 
         * 步骤：
         *   1. 先设置 height: auto → 让内容撑开容器获得真实高度
         *      （height 从 0 跳到 auto 是瞬时的，视觉上不可见）
         *   2. 添加 'in' 类 → 触发 CSS transition 正向动画（菜单淡入/滑入）
         * 
         * 为什么先设 height 再加 class？
         *   浏览器需要知道元素的"目标高度"才能正确计算 transition。
         *   如果 height=0 时加 'in' 类，transition 从 0→0 无动画效果。
         *   先设 auto 让浏览器计算真实高度，再加 'in' 触发从该高度开始的动画。
         */
        open: function(){
            $collapse.style.height = "auto";
            $navbar.classList.add('in');
        }
    };

    // ===== 汉堡按钮点击事件 =====
    // 点击汉堡图标切换菜单的打开/关闭状态
    $toggle.addEventListener('click', function(e){
        if ($navbar.classList.contains('in')) {
            __HuxNav__.close();
        }else{
            __HuxNav__.open();
        }
    });

    /**
     * ===== 点击菜单外部区域自动关闭 =====
     * 
     * 用户体验惯例：菜单打开后，点击页面空白处应关闭菜单。
     * 此处监听整个 document 的 click 事件实现。
     * 
     * 排除规则（以下情况不关闭菜单）：
     *   e.target == $toggle         → 点击汉堡按钮本身（由上面的 toggle 处理）
     *   e.target.className == 'icon-bar' → 点击汉堡按钮内的横线（按钮的子元素）
     * 
     * 为什么不用 e.stopPropagation()？
     *   FastClick.js 在 document 上全局代理 'touchstart' 来消除 iOS 300ms 延迟，
     *   对 toggle 按钮使用 stopPropagation 会阻止 FastClick 的全局代理，
     *   导致移动端汉堡按钮失灵。因此改用 target 过滤而非事件拦截。
     * 
     * 为什么用 'click' 而非 'touchstart'？
     *   作为妥协方案，click 事件本身在移动端有 300ms 延迟，
     *   但关闭菜单对延迟不敏感（不是高频操作），可以接受。
     */
    document.addEventListener('click', function(e){
        if(e.target == $toggle) return;
        if(e.target.className == 'icon-bar') return;
        __HuxNav__.close();
    });
</script>
