<!--
  ============================================================
  head.html — HTML <head> 标签内容
  包含：meta 标签、SEO、CSS 加载、字体、MathJax 数学公式渲染
  ============================================================
-->

<head>
    <!-- ==================== 基础 Meta ==================== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google Search Console 验证（用于提交 sitemap，不要修改） -->
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />

    <!-- 响应式视口设置（移动端适配必需） -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SEO：页面描述（来自 _config.yml 的 description） -->
    <meta name="description" content="{{ site.description }}">

    <!-- SEO：关键词（来自 _config.yml 的 keyword） -->
    <meta name="keywords" content="{{ site.keyword }}">

    <!-- Chrome/Android 浏览器标签颜色（来自 _config.yml 的 chrome-tab-theme-color） -->
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">


    <!-- ==================== 页面标题 ==================== -->
    <!--
      逻辑：
      - 有 page.title → "文章标题 - 站点 SEO 标题"（文章页）
      - 无 page.title → 仅显示站点 SEO 标题（首页等）
      SEOTitle 来自 _config.yml，用于控制浏览器标签页显示的文字
    -->
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>


    <!-- ==================== PWA / 图标 ==================== -->
    <!-- PWA Web App Manifest（配置后可作为独立应用安装到手机桌面） -->
    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">

    <!-- 浏览器标签页 Favicon（16x16 或 32x32） -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">

    <!-- Apple 设备主屏图标（添加到 iPhone/iPad 主屏幕时显示） -->
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/img/apple-touch-icon.png">

    <!-- Canonical URL（SEO 规范链接，告诉搜索引擎页面的权威 URL） -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">


    <!-- ==================== CSS 样式表 ==================== -->
    <!-- Bootstrap 核心 CSS（栅格系统、基础组件） -->
    <link rel="stylesheet" href="{{ '/css/bootstrap.min.css' | prepend: site.baseurl }}">

    <!-- Hux Blog 主题自定义 CSS（覆盖 Bootstrap 的博客风格） -->
    <link rel="stylesheet" href="{{ '/css/hux-blog.min.css' | prepend: site.baseurl }}">

    <!-- 代码高亮 CSS（Rouge/Pygments 语法着色主题） -->
    <link rel="stylesheet" href="{{ '/css/syntax.css' | prepend: site.baseurl }}">


    <!-- ==================== Font Awesome 图标字体 ==================== -->
    <!-- 使用 CDN 加速（国内无法访问 Google Fonts，故使用 cdnjs） -->
    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet"
        type="text/css">

    <!--
      Google Fonts（已废弃，国内访问困难）：
      <link href='http://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
      <link href='http://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800' rel='stylesheet' type='text/css'>
    -->


    <!-- ==================== IE8 兼容 ==================== -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->


    <!-- ==================== MathJax 数学公式渲染 ==================== -->
    <!--
      全局加载 MathJax 3.x（使用 SVG 渲染器，兼容性好）

      配置说明：
        inlineMath      : 行内公式分隔符，$...$ 和 \(...\) 均可
        displayMath     : 块级公式分隔符，$$...$$ 和 \[...\] 均可
        processEscapes  : true → \$ 在文本中不会触发公式模式
        tags            : 'ams' → 公式编号靠右（AMS 风格）
        skipHtmlTags    : 跳过这些标签内的内容，避免误解析
        fontCache       : 'global' → SVG 字体缓存模式（性能更好）

      如需按页面控制是否加载，可在外层添加：
        {% if page.mathjax %}
          ...MathJax 代码...
        {% endif %}
      当前策略：所有页面均加载（缺点：无公式页面也有额外请求）
    -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

</head>
