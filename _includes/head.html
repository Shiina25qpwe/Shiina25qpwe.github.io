<!-- 
  ============================================================
  head.html - 站点全局 <head>，被每个页面的 layout 引入
  ============================================================
  包含：meta 标签、SEO 信息、CSS 样式、PWA manifest、
  MathJax 数学公式、IE 兼容性处理
  
  【Jekyll 语法速查】
    {{ site.xxx }}                     → 输出 _config.yml 中的配置值
    {{ page.xxx }}                     → 输出当前页面 front-matter 中的变量
    {{ "path" | prepend: site.url }}   → 拼接字符串，如 "https://xxx/path"
    {% if page.xxx %} ... {% endif %}  → 条件渲染（检查 front-matter 是否有该变量）
    {% if page.title %}A{% else %}B{% endif %} → 三元判断：有标题则显示 "页标题 - SEO标题"，否则只显示 SEO标题
-->

<head>
    <!-- 
      ===== 基础 Meta 标签 =====
      charset         → 字符编码 UTF-8（必须第一行，防止编码攻击）
      X-UA-Compatible → 强制 IE 使用最新渲染模式
      viewport        → 移动端视口适配（width=device-width 响应式基础）
    -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google 站点验证（在 _config.yml 中配置 google_site_verification） -->
    {% if site.google_site_verification %}
    <meta name="google-site-verification" content="{{ site.google_site_verification }}">
    {% endif %}

    <!-- 
      SEO Meta：描述和关键词
      site.description : 站点描述（_config.yml），用于搜索引擎摘要，建议 ≤160 字符
      site.keyword     : 站点关键词（_config.yml），逗号分隔，如 "博客,技术,Jekyll"
                         ⚠ 注意是单数 keyword 不是 keywords（Hux 主题命名惯例）
                         Google 已不再使用此 meta 做排名，但百度等仍可能读取
    -->
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="{{ site.keyword }}">

    <!-- 
      Chrome/Android 标签页主题色
      在 _config.yml 中配置: chrome-tab-theme-color: "#000000"
      支持格式: #RRGGBB 十六进制颜色值
      Liquid 中访问含连字符的 YAML key 推荐方括号写法 site['chrome-tab-theme-color']
      效果: Android Chrome 地址栏 / 任务切换器 背景变色为此颜色
    -->
    <meta name="theme-color" content="{{ site['chrome-tab-theme-color'] }}">

    <!-- 
      ===== 页面标题 =====
      文章页：显示 "文章标题 - 站点SEO标题"
      首页/其他：仅显示 "站点SEO标题"
      site.SEOTitle 可不同于 site.title（比如标题用英文，SEO标题加中文关键词）
    -->
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <!-- ===== PWA（Progressive Web App）支持 ===== -->
    <!-- 
      Web App Manifest：定义 PWA 的名称、图标、启动方式等
      配合 footer.html 中的 Service Worker 实现离线访问
    -->
    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">

    <!-- 
      Favicon（浏览器标签页图标）
      shortcut icon → 传统写法，现代浏览器也支持 rel="icon"
    -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">

    <!-- 
      Apple Touch Icon（iOS 添加到主屏幕时的图标）
      建议至少 180x180px，iOS 会自动裁剪圆角
    -->
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/img/apple-touch-icon.png">

    <!-- 
      ===== Canonical URL（规范链接） =====
      告诉搜索引擎本页面的首选 URL，防止重复内容惩罚
      涉及的 _config.yml 配置:
        site.url     : 站点完整域名，不含尾部斜杠
                       示例: "https://example.com"（不是 "https://example.com/"）
        site.baseurl : 子目录路径（若部署在子目录），不含尾部斜杠
                       示例: "/blog"（根目录部署则为 ""）
      
      Pipeline 执行顺序（从左到右）:
        1. page.url                        → 页面原始路径，如 /2024/01/01/post-title/
        2. | replace:'index.html',''       → 去掉 index.html（Jekyll 默认索引页）
        3. | prepend: site.baseurl         → 拼接站点根路径，如 /blog
        4. | prepend: site.url             → 拼接完整域名，如 https://example.com
      
      最终输出示例: https://example.com/blog/2024/01/01/post-title/
    -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- ===== CSS 样式表（同步加载，阻塞渲染以消除 FOUC） ===== -->
    <!-- 
      Bootstrap v3 核心样式
      提供栅格系统、按钮、导航栏等基础 UI 组件
    -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- 
      主题自定义样式（Hux Blog）
      覆盖 Bootstrap 默认样式，定义博客专属外观（字体、配色、动画等）
    -->
    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">

    <!-- 
      代码语法高亮样式（Pygments/Rouge）
      GitHub Pages 内置 Rouge 高亮器，此 CSS 控制代码块配色
    -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- 
      Font Awesome 图标字体库 v4.6.3
      提供社交图标、UI 图标等（fa-github, fa-twitter, fa-rss...）
      使用协议相对路径（//）自动匹配 http/https
    -->
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css">

    <!-- 
      ===== IE 兼容性处理 =====
      <!--[if lt IE 9]> 是 IE 条件注释，仅 IE9 以下版本解析
      
      html5shiv   → 让 IE8- 识别 HTML5 新标签（<article>, <section>, <nav> 等）
      respond.js  → 让 IE8- 支持 CSS3 Media Queries（响应式布局基础）
      
      注意：这些脚本通过 file:// 协议打开时无效（respond.js 限制），
      需通过 HTTP 服务器访问
    -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <!-- 
      ===== MathJax 数学公式渲染（按需加载） =====
      仅在文章的 front-matter 中设置 mathjax: true 时才加载此库
      例如：
        ---
        layout: post
        title: "数学文章"
        mathjax: true
        ---
      
      ── tex 渲染配置 ──
        inlineMath    : 行内公式分隔符，如 $x^2+y^2=z^2$
                        支持多组：默认 ['$','$'] 和 ['\(','\)']
        displayMath   : 块级（居中独占一行）公式分隔符
                        默认 ['$$','$$'] 和 ['\[','\]']
        processEscapes: 是否处理转义符
                        true  → \$ 显示为普通美元符号（不受公式干扰）
                        false → \$ 可能被误解析为公式
        tags          : 公式编号风格
                        'ams'  → AMS 数学风格编号（推荐，支持 \label \ref）
                        'all'  → 所有公式都编号
                        'none' → 不编号

      ── SVG 输出配置 ──
        fontCache     : 字体缓存策略
                        'global' → 全局缓存（推荐，避免重复嵌入字体数据）
                        'local'  → 每个公式独立缓存（兼容性更好）
                        'none'   → 不缓存（某些旧浏览器可能需要）

      ── 处理选项 ──
        skipHtmlTags  : 跳过这些 HTML 标签内的文本，不解析为公式
                        防止 <script> 或 <pre> 中的 $ 被误转换
    -->
    {% if page.mathjax %}
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <!-- 
      MathJax v3 使用 tex-svg 组件（无需完整库）
      async → 不阻塞页面渲染
      id="MathJax-script" → MathJax 通过此 id 自动找到配置对象
    -->
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    {% endif %}

    <!-- 
      ===== async(u, c) - 通用异步脚本加载器（全局单一定义） =====
      此函数被 footer.html 及各 layout 的 anchorjs/Gitalk 等脚本共享使用。
      定义在 <head> 末尾确保在任何内联脚本调用之前可用。
      
      参数:
        u (string)         : 脚本 URL 地址
        c (function|null)  : 加载完成后的回调，签名 function(error, event)
      
      原理: 动态创建 <script> 标签并插入 DOM，不阻塞页面渲染。
    -->
    <script>
        function async(u, c) {
          var d = document, t = 'script',
              o = d.createElement(t),
              s = d.getElementsByTagName(t)[0];
          o.src = u;
          if (c) { o.addEventListener('load', function (e) { c(null, e); }, false); }
          s.parentNode.insertBefore(o, s);
        }
    </script>

</head>
